apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: sap-gardener-ironcore
  labels:
    app.kubernetes.io/name: sap-provider-operator
    app.kubernetes.io/managed-by: sap-provider-operator
spec:
  autoscaling: true
  target:
    # Garden project namespace — deployment-specific. Set the
    # GARDEN_PROJECT_NAMESPACE env var on the operator to override.
    namespace: garden-<your-gardener-project>
    # kubeconfigSecretRef is overwritten by the operator (global/kcp source).
    kubeconfigSecretRef:
      name: sap-gardener-kubeconfig
      namespace: sap-provider
  inputs:
    - { name: cloudProfile, type: string,   default: ironcore,                    description: "Gardener CloudProfile name" }
    - { name: region,       type: string,   default: wdf4,                        description: "Cloud region" }
    - { name: k8sVersion,   type: string,   default: "1.34.5",                    description: "Kubernetes version" }
    - { name: machineType,  from: profile,                                        description: "Worker machine type; auto-picked as the smallest profile fitting the SC's requested cpu/memory" }
    - { name: machineImage, type: string,   default: gardenlinux,                 description: "Worker OS image name" }
    - { name: zone,         type: string,   default: wdf4b,                       description: "Availability zone for the worker pool" }
  # Machine types from the ironcore CloudProfile.
  profiles:
    - { name: memory-intel1-1cpu, cpu: "1", memory: 8Gi }
    - { name: memory-intel1-2cpu, cpu: "2", memory: 16Gi }
    - { name: memory-intel1-4cpu, cpu: "4", memory: 32Gi }
  # The SimpleCluster materialises a local IronCoreShoot on the service cluster
  # (this provider's own CR); the sap-provider operator turns it into a real
  # Gardener Shoot on the garden and maintains the admin-kubeconfig Secret next
  # to it, which the kubeconfigSource below hands back to the SimpleCluster. The
  # IronCoreShoot.spec is the plain Gardener Shoot manifest, rendered here with
  # the SimpleCluster's inputs. spec.target.namespace above is the garden
  # project namespace the operator places the Shoot in (read from this skeleton,
  # not applied by the SimpleCluster); the operator rewrites the ensured SCPC's
  # target to the account namespace so the IronCoreShoot lands locally.
  resources:
    - name: shoot
      apiVersion: sap.eu/v1alpha1
      kind: IronCoreShoot
      nameTemplate: '{{- printf "%s/%s" .SC.namespace .SC.name | sha256sum | trunc 8 | printf "sc-%s" }}'
      readiness:
        phasePath: status.phase
        phaseReadyValue: Ready
        phaseFailedValues:
          - Failed
      template: |
        apiVersion: sap.eu/v1alpha1
        kind: IronCoreShoot
        metadata:
          labels:
            # Routes the up-sync to the owning KCP workspace (logical-cluster id).
            sync.apeirora.eu/owner-cluster: '{{ .SC.namespace }}'
        spec: |
          apiVersion: core.gardener.cloud/v1beta1
          kind: Shoot
          spec:
            cloudProfile:
              name: {{ .Inputs.cloudProfile }}
              kind: CloudProfile
            credentialsBindingName: wdf4-ora-dev
            region: {{ .Inputs.region }}
            kubernetes:
              version: "{{ .Inputs.k8sVersion }}"
            addons:
              nginxIngress:
                enabled: false
            provider:
              type: ironcore
              workers:
                - name: worker-main
                  minimum: {{ .SC.workers.min }}
                  maximum: {{ .SC.workers.max }}
                  machine:
                    type: {{ .Inputs.machineType }}
                    image:
                      name: {{ .Inputs.machineImage }}
                  volume:
                    type: general-purpose
                    size: 10Gi
                  zones:
                    - {{ .Inputs.zone }}
            networking:
              type: calico
              providerConfig:
                apiVersion: calico.networking.extensions.gardener.cloud/v1alpha1
                kind: NetworkConfig
                overlay:
                  enabled: false
                typha:
                  enabled: false
                vxlan:
                  enabled: true
              nodes: 10.250.0.0/16
              pods: 100.64.0.0/12
              services: 100.104.0.0/13
  # The IronCoreShoot operator mints the admin kubeconfig into a Secret named
  # <shoot>-ironcoreshoot-kubeconfig next to the CR; hand that back verbatim.
  kubeconfigSource:
    resourceName: shoot
    secretRef:
      name: '{{ .Target.name }}-ironcoreshoot-kubeconfig'
