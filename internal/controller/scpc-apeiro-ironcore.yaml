apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: apeiro-gardener-ironcore
  labels:
    app.kubernetes.io/name: apeiro-provider-operator
    app.kubernetes.io/managed-by: apeiro-provider-operator
spec:
  autoscaling: true
  target:
    namespace: ""
  inputs: []
  profiles: []
  # The SimpleCluster materialises a local IronCoreShoot on the service cluster
  # (this provider's own CR); the apeiro-provider operator turns it into a real
  # Gardener Shoot on the garden and maintains the admin-kubeconfig Secret next
  # to it, which the kubeconfigSource below hands back to the SimpleCluster. The
  # IronCoreShoot.spec is the plain Gardener Shoot manifest, rendered here with
  # the SimpleCluster's inputs. spec.target.namespace above is the garden
  # project namespace the operator places the Shoot in (read from this skeleton,
  # not applied by the SimpleCluster); the operator rewrites the ensured SCPC's
  # target to the account namespace so the IronCoreShoot lands locally.
  resources:
    - name: shoot
      apiVersion: apeiro.eu/v1alpha1
      kind: IronCoreShoot
      nameTemplate: '{{- printf "%s/%s" .SC.namespace .SC.name | sha256sum | trunc 8 | printf "sc-%s" }}'
      readiness:
        phasePath: status.phase
        phaseReadyValue: Ready
        phaseFailedValues:
          - Failed
      template: |
        apiVersion: apeiro.eu/v1alpha1
        kind: IronCoreShoot
        metadata:
          labels:
            # Routes the up-sync to the owning KCP workspace (logical-cluster id).
            sync.apeirora.eu/owner-cluster: '{{ .SC.namespace }}'
        spec: |
          apiVersion: core.gardener.cloud/v1beta1
          kind: Shoot
          spec:
            provider:
              type: ironcore
  # The IronCoreShoot operator mints the admin kubeconfig into a Secret named
  # <shoot>-ironcoreshoot-kubeconfig next to the CR; hand that back verbatim.
  kubeconfigSource:
    resourceName: shoot
    secretRef:
      name: '{{ .Target.name }}-ironcoreshoot-kubeconfig'
