name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The provider bundle has an envtest-backed `make test`.
          - module: .
            cmd: make test
          # ironcore-operator ships a trimmed Makefile (build/vet, no test target).
          - module: ironcore-operator
            cmd: go build ./... && go vet ./...
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Running Tests
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          ${{ matrix.cmd }}
