name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The provider bundle has an envtest-backed `make test`.
          - module: .
            cmd: make test
          # ironcore-operator ships a trimmed Makefile (build/vet, no test target).
          - module: ironcore-operator
            cmd: go build ./... && go vet ./...
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Running Tests
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          ${{ matrix.cmd }}

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  helm:
    name: Helm (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - ironcore-operator
          - sapprovider-operator
          - sapprovider-pm-integration
          - sapprovider-sync-agent
          - sapprovider-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint, template and package chart
        run: |
          set -euo pipefail
          chart_dir="charts/${{ matrix.chart }}"
          helm dependency build "$chart_dir" || helm dependency update "$chart_dir"
          values_args=()
          if [[ "${{ matrix.chart }}" == "sapprovider-operator" ]]; then
            values_args=(-f "$chart_dir/examples/garden-dev.yaml")
          fi
          helm lint "$chart_dir" "${values_args[@]}"
          helm template "ci-${{ matrix.chart }}" "$chart_dir" --namespace default "${values_args[@]}" >/dev/null
          helm package "$chart_dir" --destination "dist/${{ matrix.chart }}"
