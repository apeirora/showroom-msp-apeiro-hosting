name: Compliance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reuse:
    name: Gate — REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: REUSE lint
        uses: fsfe/reuse-action@v5

  dependencies:
    name: Gate — Dependency licences
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the SBOM and licence audit are current
        run: bash hack/check-sbom-current.sh

  vulnerabilities:
    name: Gate — Vulnerabilities (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - ironcore-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  secrets:
    name: Gate — Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Run gitleaks directly rather than through gitleaks-action: the action
      # requires a GITLEAKS_LICENSE secret for organisation-owned repositories,
      # and pinning the image keeps a new upstream release from turning this
      # gate red on an unrelated pull request.
      #
      # Scans the tree, which is what a per-change gate should do.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            "zricethezav/gitleaks:${GITLEAKS_VERSION}" \
            dir /repo --config /repo/.gitleaks.toml --redact

  vulnerabilities-ui:
    name: Gate — Vulnerabilities (ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
