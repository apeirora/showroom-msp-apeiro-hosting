name: Publish

# Builds and pushes the provider operator + UI images and packages every
# Helm chart at one version, with that version stamped into each chart's version,
# appVersion and image tag. Charts are packaged only after their images exist, so
# a chart X.Y.Z always pulls images X.Y.Z.
#
# Normally invoked by the Release Please workflow on a release. Can also be run
# manually (workflow_dispatch) to re-publish at an explicit version.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version to build/stamp into all images and charts and publish at (also tagged :latest)."

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publish image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            image: sap-provider-operator
            platforms: linux/amd64
          - context: ui
            image: sapprovider-ui
            platforms: linux/amd64
          - context: ironcore-operator
            image: ironcore-operator
            platforms: linux/amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/apeirora/${{ matrix.image }}:${{ inputs.version }}
            ghcr.io/apeirora/${{ matrix.image }}:latest

  publish-charts:
    name: Package and publish Helm charts
    needs: publish-images
    runs-on: ubuntu-latest
    env:
      OCI_REPO: oci://ghcr.io/apeirora/charts
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push charts at the release version
        run: |
          set -euo pipefail
          V="${VERSION}"
          CHARTS=(
            charts/sapprovider-operator
            charts/sapprovider-pm-integration
            charts/sapprovider-sync-agent
            charts/sapprovider-ui
            charts/ironcore-operator
          )
          mkdir -p .cr-release-packages
          for c in "${CHARTS[@]}"; do
            echo ">>> $c @ $V"
            # Resolve external deps (api-syncagent) before packaging.
            helm dependency build "$c" || true
            helm package "$c" --version "$V" --app-version "$V" --destination .cr-release-packages
          done
          for pkg in .cr-release-packages/*.tgz; do
            echo ">>> push $pkg"
            helm push "$pkg" "$OCI_REPO"
          done

  publish-ocm:
    name: Publish the OCM component
    needs: [publish-images, publish-charts]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      OCM_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/ocm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the OCM CLI
        run: curl -sSfL https://ocm.software/install.sh | sudo bash

      - name: Build and push the component version
        run: |
          set -euo pipefail
          mkdir -p dist/ctf
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ocm add componentversions --create --file dist/ctf \
            .ocm/component-constructor.yaml \
            VERSION="${VERSION}" GITHUB_REPOSITORY_OWNER="${owner}"
          ocm transfer commontransportarchive dist/ctf "$OCM_REPOSITORY" \
            --copy-resources --overwrite
