# This rule is not used by the project showroom-msp-apeiro-provider itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to apeiro.eu resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: showroom-msp-apeiro-provider
    app.kubernetes.io/managed-by: kustomize
  name: shoot-viewer-role
rules:
- apiGroups:
  - apeiro.eu
  resources:
  - openstackshoots
  - ironcoreshoots
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apeiro.eu
  resources:
  - openstackshoots/status
  - ironcoreshoots/status
  verbs:
  - get
