# This rule is not used by the project showroom-msp-apeiro-provider itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over apeiro.eu.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: showroom-msp-apeiro-provider
    app.kubernetes.io/managed-by: kustomize
  name: shoot-admin-role
rules:
- apiGroups:
  - apeiro.eu
  resources:
  - openstackshoots
  - ironcoreshoots
  verbs:
  - '*'
- apiGroups:
  - apeiro.eu
  resources:
  - openstackshoots/status
  - ironcoreshoots/status
  verbs:
  - get
