# This rule is not used by the project showroom-msp-apeiro-provider itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apeiro.eu.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: showroom-msp-apeiro-provider
    app.kubernetes.io/managed-by: kustomize
  name: shoot-editor-role
rules:
- apiGroups:
  - apeiro.eu
  resources:
  - openstackshoots
  - ironcoreshoots
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apeiro.eu
  resources:
  - openstackshoots/status
  - ironcoreshoots/status
  verbs:
  - get
