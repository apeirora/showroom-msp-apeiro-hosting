---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apeiro.eu
  resources:
  - ironcorevms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apeiro.eu
  resources:
  - ironcorevms/finalizers
  verbs:
  - update
- apiGroups:
  - apeiro.eu
  resources:
  - ironcorevms/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - sshkeys.apeirora.eu
  resources:
  - sshkeys
  verbs:
  - get
  - list
  - watch
