apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: apeiro.eu
  labels:
    # Marketplace/ContentConfigurations virtual-workspace filters on content-for
    # = APIExport name. Must match `apeiro.eu` verbatim.
    ui.platform-mesh.io/content-for: apeiro.eu
spec:
  resources:
    - group: apeiro.eu
      name: openstackshoots
      schema: {{ .Values.schemaRevision }}.openstackshoots.apeiro.eu
      storage:
        crd: {}
    - group: apeiro.eu
      name: ironcoreshoots
      schema: {{ .Values.schemaRevision }}.ironcoreshoots.apeiro.eu
      storage:
        crd: {}
    # IronCoreVM: namespaced VM API served by simple-cluster-operator-ironcore,
    # synced by apeiroprovider-sync-agent. Rotates via vmSchemaRevision.
    - group: apeiro.eu
      name: ironcorevms
      schema: {{ .Values.vmSchemaRevision }}.ironcorevms.apeiro.eu
      storage:
        crd: {}
  permissionClaims:
    # The syncagent mirrors namespaces and Events between KCP and the MSP cluster.
    - group: ""
      resource: namespaces
      verbs: ["*"]
    - group: ""
      resource: events
      verbs: ["*"]
    # Reserved for a future bring-your-own-credentials path: a workspace
    # Secret referenced from a flavor CR would be mirrored down to the MSP side.
    - group: ""
      resource: secrets
      verbs: ["*"]
