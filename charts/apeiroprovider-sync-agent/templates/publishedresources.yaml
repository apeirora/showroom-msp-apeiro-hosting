{{- if .Values.publishedResources.enabled }}
{{- $ns := .Values.publishedResources.namespace | default .Release.Namespace }}
{{- $ck := .Values.publishedResources.clientKubeconfig }}
{{- range $r := list (dict "kind" "OpenStackShoot" "name" "publish-apeiro-openstackshoots") (dict "kind" "IronCoreShoot" "name" "publish-apeiro-ironcoreshoots") }}
---
apiVersion: syncagent.kcp.io/v1alpha1
kind: PublishedResource
metadata:
  name: {{ $r.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: apeiroprovider-sync-agent
    app.kubernetes.io/component: portal-integration
spec:
  resource:
    kind: {{ $r.kind }}
    apiGroup: apeiro.eu
    version: v1alpha1
  projection:
    # Namespaced on the service cluster, cluster-scoped in the KCP workspace.
    scope: Cluster
  naming:
    namespace: "{{`{{ .ClusterName }}`}}"
    name: "{{`{{ .Object.metadata.name }}`}}"
  related:
    # Mirror the kubeconfig Secret written by the operator back into the
    # consuming account workspace so the portal can download it.
    - identifier: kubeconfig-secret
      origin: service
      kind: Secret
      object:
        # Related Secrets live in the physical primary namespace and in the
        # consuming account's default namespace. Both sides need an explicit map.
        namespace:
          template:
            template: '{{`{{ if eq .Side "service" }}{{ .Object.metadata.namespace }}{{ else }}default{{ end }}`}}'
        reference:
          path: status.kubeconfigSecretRef.name
  {{- if $ck.enabled }}
    # kubeconfig source 'kcp': mirror the client-provided kubeconfig Secret
    # from the KCP workspace down into the CR's namespace on the service
    # cluster, where the operator reads it as the SCPC target.
    - identifier: client-kubeconfig
      origin: kcp
      kind: Secret
      object:
        # Use the same map in reverse for a client Secret from KCP.
        namespace:
          template:
            template: '{{`{{ if eq .Side "service" }}{{ .Object.metadata.namespace }}{{ else }}default{{ end }}`}}'
        template:
          template: {{ $ck.secretName | quote }}
  {{- end }}
{{- end }}
---
# IronCoreVM: namespaced on both sides — the KCP workspace namespace maps to a
# per-workspace namespace on the service cluster (the logical cluster id), so no
# projection.scope override. Mirrors the CloudFerro OpenStackVM PublishedResource
# structure, but carries the apeiroprovider labels the agent's
# --published-resource-selector filters on.
apiVersion: syncagent.kcp.io/v1alpha1
kind: PublishedResource
metadata:
  name: publish-ironcore-ironcorevms
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: apeiroprovider-sync-agent
    app.kubernetes.io/component: portal-integration
spec:
  resource:
    kind: IronCoreVM
    apiGroup: apeiro.eu
    version: v1alpha1
  naming:
    namespace: "{{`{{ .ClusterName }}`}}"
    name: "{{`{{ .Object.metadata.name }}`}}"
  related:
    # Mirror the per-VM SSH keypair Secret the operator generates back into the
    # consuming account workspace so the portal can download the private key.
    # Same namespace as the primary on both sides, so no namespace mapping.
    - identifier: ssh-secret
      origin: service
      kind: Secret
      object:
        reference:
          path: status.sshSecretRef.name
{{- end }}
