scpc:
  ironcore:
    projectNamespace: garden-dev
    shootAnnotations:
      authentication.gardener.cloud/issuer: managed
    profiles:
      - {name: memory-intel1-1cpu, cpu: "1", memory: 8Gi}
      - {name: memory-intel1-2cpu, cpu: "2", memory: 16Gi}
      - {name: memory-intel1-4cpu, cpu: "4", memory: 32Gi}
      - {name: memory-intel1-8cpu, cpu: "8", memory: 64Gi}
    shootSpec:
      cloudProfile: {name: ironcore, kind: CloudProfile}
      credentialsBindingName: ironcore-infra
      region: wdf4
      kubernetes: {version: "1.33.13"}
      dns:
        # The physical account namespace separates same-named requests.
        domain: "{{ .SC.name }}.{{ .SC.namespace }}.dev.ic.showroom.apeirora.eu"
        providers:
          - type: openstack-designate
            primary: true
            credentialsRef:
              apiVersion: v1
              kind: Secret
              name: designate-dns
      extensions:
        - type: shoot-dns-service
        - type: shoot-cert-service
      provider:
        type: ironcore
        workers:
          - name: worker-main
            machine:
              architecture: amd64
              image: {name: gardenlinux, version: "2150.1.0"}
            volume: {type: general-purpose, size: 50Gi}
            zones: [wdf4a, wdf4b, wdf4c]
      networking:
        type: calico
        nodes: 10.250.0.0/16
        pods: 100.64.0.0/12
        services: 100.104.0.0/13
        providerConfig:
          apiVersion: calico.networking.extensions.gardener.cloud/v1alpha1
          kind: NetworkConfig
          overlay: {enabled: true}
          vxlan: {enabled: true}
      addons:
        nginxIngress: {enabled: false}
