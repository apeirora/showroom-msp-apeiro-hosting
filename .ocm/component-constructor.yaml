# OCM component for the Apeiro hosting provider stack.
#
# Every image and chart is referenced at the same ${VERSION} — the one the
# publish workflow stamps into all of them — so a component version always
# resolves to a self-consistent set of artefacts.
#
# Rendered by .github/workflows/publish.yml; ${VERSION} and
# ${GITHUB_REPOSITORY_OWNER} are substituted by the OCM CLI.
name: showroom.apeirora.eu/apeiro-hosting
version: ${VERSION}
provider:
  name: ${GITHUB_REPOSITORY_OWNER}

resources:
  # ---------------------------------------------------------------- images
  - name: apeiro-provider-operator-image
    type: ociImage
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY_OWNER}/apeiro-provider-operator:${VERSION}

  - name: apeiroprovider-ui-image
    type: ociImage
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY_OWNER}/apeiroprovider-ui:${VERSION}

  - name: ironcore-operator-image
    type: ociImage
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ironcore-operator:${VERSION}

  # ----------------------------------------------------------- helm charts
  - name: apeiroprovider-operator-chart
    type: helmChart
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/apeiroprovider-operator:${VERSION}

  - name: apeiroprovider-pm-integration-chart
    type: helmChart
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/apeiroprovider-pm-integration:${VERSION}

  - name: apeiroprovider-sync-agent-chart
    type: helmChart
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/apeiroprovider-sync-agent:${VERSION}

  - name: apeiroprovider-ui-chart
    type: helmChart
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/apeiroprovider-ui:${VERSION}

  - name: ironcore-operator-chart
    type: helmChart
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/ironcore-operator:${VERSION}
